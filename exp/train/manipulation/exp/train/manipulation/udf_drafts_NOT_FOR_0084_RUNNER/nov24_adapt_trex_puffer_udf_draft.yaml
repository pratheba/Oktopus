# Matched adaptation records only; NOT a validated UDF cutting config.
# The 0084 hard-coded puffer stitch runner does NOT support generic outfits.
# 0107 direct-UDF cutting uses SDF run provenance; do not give it this draft.
- target_key: trex_9_v1|body
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: trex_puffer_body
  src_0: 0.0
  src_1: 0.5
  tgt_0: 0.0
  tgt_1: 0.9
  scale: 0.8
  rot_deg: -10.0
  wrap_radius: true
  rigid_radius: false
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  auto_avatar_snug_field: true
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.01
  snug_target_gap: 0.05
  snug_gain: 3.0
  snug_min_scale: 0.0
  snug_max_scale: 1.2
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: true
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.001
  avatar_clearance: 0.001
  cut_avatar: false
  name: body
