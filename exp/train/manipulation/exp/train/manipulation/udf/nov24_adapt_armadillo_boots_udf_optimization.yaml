# Legacy UDF adaptation/optimization counterpart for armadillo + boots.
# Mirrors the SIX nov24 SDF pairing files, with all adaptation keys/order unchanged.
# The UDF options below are copied from the historical oct22 generic UDF optimizer.
# IMPORTANT: This is NOT a neural UDF training config and it is NOT read by
# tools/udf_run_direct.py (0107 direct postprocessing).
# Provided for independent UDF experiments with a YAML-accepting legacy runner;
# its compatibility with your current source branch is UNVERIFIED.
# Matching SDF: nov24_adapt_armadillo_boots_sdf.yaml
sdf_projection_workers_0054: 2
sdf_projection_cache_0054: true
sdf_projection_refine_fast_0055: true
sdf_projection_profile_split_0055: false
sdf_projection_leafsize_0056: 32
sdf_prediction_scratch_dir_0056: /tmp
sdf_prediction_zero_copy_write_0056: true
sdf_inference_batch_size: 262144
sdf_perf_timing: true
sdf_localize_after_gate: true
dcsdd_bounded_filtering: true
dcsdd_filter_batch_size: 262144
dcsdd_fast_bbox_marking: true
dcsdd_crop_grid: true
sdf_candidate_piecewise_0057: false
sdf_localize_sphere_0058: false
sdf_localize_reuse_0059: false
sdf_projection_grid_0062: false
sdf_projection_bound_query_0062: false
combine_adaptations: true
export_individual_meshes: true
adaptations:
- target_key: armadillo_13_v1|l_leg
  accessory_key: boots_2_v1|shaft
  mode: direct
  cache_as: armadillo_boot_shaft
  src_0: 0.3
  src_1: 0.9
  tgt_0: 0.0
  tgt_1: 0.9
  rot_deg: 175.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.0
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false
  wrap_radius: true
  rigid_radius: false
  scale: 0.8
  use_accessory_support_clamp: false
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  wrap_scale_min: 0.5
  wrap_scale_max: 2.2
  auto_avatar_snug_field: true
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.015
  snug_target_gap: 0.005
  snug_gain: 1.0
  snug_min_scale: 0.95
  snug_max_scale: 1.05
  snug_min_count: 6
  snug_smooth_s: 3.0
  snug_smooth_theta: 2.0
  snug_debug: true
  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true
  use_tiled_detail: true
  detail_tile_start: 0.15
  detail_tile_end: 0.8
  blend_group: boot
  mesh_blend_delta: 0.005
  name: boot_shaft
- target_key: armadillo_13_v1|l_foot
  accessory_key: boots_2_v1|foot
  mode: direct
  cache_as: armadillo_boot_foot
  src_0: 0.0
  src_1: 1.0
  tgt_0: 0.95
  tgt_1: 0.0
  rot_deg: 100.0
  tloc:
  - 0.0
  - -0.01
  - 0.06
  tilt_v: -3.0
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  wrap_radius: false
  rigid_radius: true
  scale: 1.2
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false
  wrap_scale_min: 0.5
  wrap_scale_max: 2.2
  auto_avatar_snug_field: false
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false
  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true
  blend_group: boot
  name: boot_foot
udf_model_batch_size: 32768
udf_cut_query_batch_size: 32768
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_cleanup_boundary: false
udf_cut_write_debug_outputs: false
