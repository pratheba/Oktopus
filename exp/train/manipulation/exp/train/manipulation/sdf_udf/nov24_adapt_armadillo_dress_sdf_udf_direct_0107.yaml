# EXPERIMENTAL 0107 direct UDF cutter config. NOT geometry-validated.
# Requires matching sdf/paired_direct/nov24_adapt_armadillo_dress_sdf_for_direct_0107.yaml run, and its ownership manifest.
# tools/udf_run_direct.py injects udf_direct_fused_0100 at runtime.
root_leaves:
  output_mode: separate_parts
  export_legacy_combined: false
  parts:
    dress_top:
      adaptation_indices:
      - 0
    dress_bottom:
      adaptation_indices:
      - 1
udf_model_batch_size: 32768
udf_cut_query_batch_size: 32768
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_cleanup_boundary: false
udf_cut_write_debug_outputs: false
adaptations:
- target_key: armadillo_13_v1|body
  accessory_key: dress_2_v2|top
  mode: direct
  cache_as: armadillo_dress_top
  src_0: 0.2
  src_1: 0.55
  tgt_0: 0.2
  tgt_1: 0.9
  rot_deg: 0.0
  tloc:
  - 0.0
  - 0.0
  - 0.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.0
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false
  wrap_radius: true
  rigid_radius: false
  scale: 0.7
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  free_mode: wrap
  use_attach_to_free_blend: false
  wrap_scale_min: 0.7
  wrap_scale_max: 1.4
  auto_avatar_snug_field: true
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.015
  snug_target_gap: 0.005
  snug_gain: 2.0
  snug_min_scale: 0.9
  snug_max_scale: 1.4
  name: dress_top
- target_key: armadillo_13_v1|body
  accessory_key: dress_2_v2|bottom
  mode: direct
  cache_as: armadillo_dress_bottom
  src_0: 0.45
  src_1: 1.0
  tgt_0: 0.1
  tgt_1: 0.9
  rot_deg: 0.0
  tloc:
  - 0.0
  - 0.0
  - 0.0
  tilt_u: 5.0
  tilt_u_anchor: 0.1
  tilt_v: 0.0
  tilt_v_anchor: 0.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.0
  adapt_localize_norm: 3.0
  adapt_use_owned_gate: false
  wrap_radius: true
  rigid_radius: false
  scale: 1.0
  wrap_scale_min: 0.15
  wrap_scale_max: 2.2
  wrap_adapt_n_keypoints: 4
  wrap_adapt_smooth_s: 8.0
  wrap_adapt_smooth_theta: 4.0
  wrap_adapt_lookup_n: 128
  debug_export_wrap_used: false
  use_adapt_control_filter_grid: false
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  use_adapt_control_field: false
  adapt_control_n_keypoints: 12
  avatar_control_smooth_points_sigma: 8.0
  avatar_control_smooth_radius_sigma: 0.0
  avatar_control_rebuild_frames: true
  free_mode: unified_wrap
  use_attach_to_free_blend: true
  attach_blend_coord: accessory
  attach_coord_space: relative
  attach_s0: 0.0
  attach_s1: 0.15
  unified_release_band: 0.05
  unified_flare_end: 0.25
  unified_flare_gain: 0.7
  unified_hold_umbrella: true
  auto_avatar_snug_field: true
  use_soft_snug: true
  use_hard_avatar_clamp: false
  cut_avatar: false
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.015
  snug_target_gap: 0.005
  snug_gain: 2.0
  snug_min_scale: 0.9
  snug_max_scale: 1.4
  snug_min_count: 6
  snug_smooth_s: 3.0
  snug_smooth_theta: 2.0
  snug_debug: true
  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true
  debug_wrap_radius_stats: true
  fix_thigh_collapse: true
  r_src_floor_percentile: 40
  name: dress_bottom
