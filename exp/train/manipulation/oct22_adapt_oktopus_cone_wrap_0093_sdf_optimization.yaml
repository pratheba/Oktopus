# 0093: generic eligible wrap streaming example (cone is just one test case).
# Two direct wrap sections blend as cone_body, then avatar Boolean subtraction.
# Applies the same guarded algorithm to any 2+ direct, same-target, zero-angular
# wrap sections with contiguous post-SDF seam blending (not cone-specific).
# Rigid/wrap mixed YAMLs use the standard path + per-adaptation safe shortcut.
# With 0093 postblend enabled, per-item cut_avatar must be false.
sdf_projection_workers_0054: 2
sdf_projection_cache_0054: true
sdf_projection_refine_fast_0055: true
sdf_projection_profile_split_0055: false
sdf_projection_leafsize_0056: 32
sdf_prediction_scratch_dir_0056: /tmp
sdf_prediction_zero_copy_write_0056: true
sdf_inference_batch_size: 262144
sdf_perf_timing: true
sdf_localize_after_gate: true
dcsdd_bounded_filtering: false
dcsdd_filter_batch_size: 262144
dcsdd_fast_bbox_marking: true
dcsdd_crop_grid: true
sdf_candidate_piecewise_0057: false
sdf_localize_sphere_0058: false
sdf_localize_reuse_0059: false
sdf_projection_grid_0062: false
sdf_projection_bound_query_0062: false
combine_adaptations: true
blend_groups:
  cone_body:
    seam_blend:
      enabled: true
      mode: overlap_crossfade
      edge_hold_fraction: 0.15
adaptations:
- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.0
  src_1: 0.3
  tgt_0: 0.0
  tgt_1: 0.7
  scale: 4.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_v: -1.5
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.1
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.1
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  wrap_scale_max: 2.0
  auto_avatar_snug_field: true
  use_soft_snug: false
  name: cone_body_1
  blend_group: cone_body
- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.2
  src_1: 0.55
  tgt_0: 0.7
  tgt_1: 0.9
  scale: 1.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_u: -3.0
  tilt_u_anchor: 0.7
  tilt_u_end: 0.9
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.1
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.1
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  wrap_scale_max: 2.5
  auto_avatar_snug_field: true
  use_soft_snug: false
  name: cone_body_2
  blend_group: cone_body
root_leaves:
  output_mode: separate_parts
  export_legacy_combined: false
  parts:
    cone:
      blend_group: cone_body
export_individual_meshes: false
sdf_fused_exterior_0087: true
sdf_wrap_auto_safe_0093: true
sdf_optimize_zero_angular_wrap: true
sdf_stream_combined_wrap: true
sdf_postblend_avatar_boolean_0093:
  enabled: true
  clearance: 0.0001
  avatar_overlap_tolerance: 0.005
sdf_stream_export_sections_0093: true
dcsdd_stream_inference: false
