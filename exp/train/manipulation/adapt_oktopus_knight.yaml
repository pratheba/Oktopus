- target_key: oktopus_9_v1|body
  accessory_key: knight_10_v1|body
  mode: direct  
  wrap_radius: true
  rigid_radius: false
  src_0: 0.5
  src_1: 1.0
  tgt_0: 0.35
  tgt_1: 0.8
  scale: 0.6
  rot_deg: 180.0
  tilt_v: 0.0
  tilt_v_anchor: 0.8
  cache_as: knight_10_v1_body_wrap

  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.0
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false

  use_accessory_support_clamp: false 
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  wrap_scale_min: 0.15
  wrap_scale_max: 1.0
  wrap_adapt_n_keypoints: 128
  wrap_adapt_smooth_s: 2.0
  wrap_adapt_smooth_theta: 1.0
  wrap_adapt_lookup_n: 128

  auto_avatar_snug_field: true 
  snug_mode: multiplicative
  snug_field_n_s: 64
  snug_field_n_theta: 64 
  snug_surface_band: 0.015
  snug_target_gap: 0.010
  snug_gain: 2.0
  snug_min_scale: 0.7
  snug_max_scale: 1.4
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: false

  use_adapt_control_field: true
  adapt_control_n_keypoints: 128

  smooth_avatar_adapt_fields: false 
  avatar_adapt_smooth_points_sigma: 0.0
  avatar_adapt_smooth_coords_sigma: .0
  avatar_adapt_rebuild_frames: true
  recompute_avatar_local_after_smooth: true

  smooth_accessory_adapt_fields: false
  accessory_adapt_smooth_points_sigma: 0.0
  accessory_adapt_smooth_radius_sigma: 0.0
  accessory_adapt_rebuild_frames: true



  accessory_offset_mode: none
  use_soft_snug: false
  target_gap: 0.010
  local_offset_strength: 0.20
  local_offset_band: 0.018
  local_offset_gate_sigma: 0.012

  detail_avatar_gate: false
  final_carve: false
  carve_c0: 0.0005
  avatar_clearance: 0.0005
  use_hard_avatar_clamp: false
  cut_avatar: false

  attach_blend_debug: false
  debug_wrap_radius_stats: true
  wrap_debug: true 
  adapt_debug_counts: false



