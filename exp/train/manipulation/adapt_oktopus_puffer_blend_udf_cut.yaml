combine_adaptations: true
# 0027: score the actual final combined SDF mesh directly with the learned UDFs.
# The old removed-vs-kept nearest-reference transfer is retained in code as a
# fallback mode, but is no longer the final authority for this experiment.
udf_cut_combined_mode: direct_udf
udf_cut_combined_transfer: false
udf_cut_write_debug_outputs: false
# Search seed/grow independently for every piece from that piece's own UDF
# score distribution. No global seed/grow multiplier is shared across pieces.
udf_cut_auto_thresholds:
  enabled: true
  # 0026: widen the fast search downward. The previous P95-P99 /
  # P80-P94 grid only offered conservative high-tail cuts. Topology, ring
  # evidence, and max_removed_fraction remain the safety gates.
  seed_percentiles: [85, 90, 92, 94, 96, 98]
  grow_percentiles: [60, 65, 70, 75, 80, 85, 90]
  min_removed_fraction: 0.002
  max_removed_fraction: 0.15
  require_topology_preserved: true
  min_positive_ring_fraction: 0.80
  min_ring_contrast_world: 0.0
  boundary_penalty: 2.0
  save_best_n: 3
  report_top_n: 5
udf_cut_combined_mc_mesh: inference/4M/adapt_oktopus_puffer_optim_512/oktopus_9_v1/oktopus_9_v1_adapt.ply
# Direct combined-UDF ownership is geometric only: it decides which exact
# adaptation mappings should be queried for a final face.  Removal evidence
# comes from those UDF queries, not from distance to cut/kept intermediate PLYs.
udf_cut_combined_direct_owner_radius_edges: 3.0
udf_cut_combined_direct_owner_fallback_radius_edges: 8.0
udf_cut_combined_direct_min_faces: 8
udf_cut_combined_direct_min_seed_faces: 2
udf_cut_combined_direct_min_seed_fraction: 0.05
udf_cut_combined_direct_min_area_world2: 0.0
udf_cut_combined_direct_preserve_existing_boundaries: true
udf_cut_combined_direct_preserve_components: true
udf_cut_combined_transfer_radius_edges: 2.0
udf_cut_combined_transfer_seed_advantage_edges: 0.30
udf_cut_combined_transfer_grow_advantage_edges: 0.0
udf_cut_combined_transfer_min_faces: 8
udf_cut_combined_transfer_min_seed_faces: 2
udf_cut_combined_transfer_min_seed_fraction: 0.05
udf_cut_combined_transfer_min_valid_samples: 2
blend_groups:
  t1:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t2:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t4:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: angular
      angular_profile_order: 3
      max_angular_radius_change: 0.08
      angular_deformation_weight: 0.02
      max_angular_tangent_change: 1.0
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t5:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
