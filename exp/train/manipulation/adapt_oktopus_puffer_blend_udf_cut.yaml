combine_adaptations: true

# Final combined UDF-cut transfer. The individual SDF meshes are still supplied
# through --mc-mesh with {index}/{mode}/{accessory} placeholders.
udf_cut_combined_transfer: true
udf_cut_combined_mc_mesh: inference/4M/adapt_oktopus_puffer/oktopus_9_v1/oktopus_9_v1_adapt.ply

# Transfer is scaled by the combined mesh edge length so it behaves similarly
# at 128/256 resolutions.
udf_cut_combined_transfer_radius_edges: 2.0
udf_cut_combined_transfer_seed_advantage_edges: 0.30
udf_cut_combined_transfer_grow_advantage_edges: 0.0
udf_cut_combined_transfer_min_faces: 8
udf_cut_combined_transfer_min_seed_faces: 2
udf_cut_combined_transfer_min_seed_fraction: 0.05
udf_cut_combined_transfer_min_valid_samples: 2
adaptations:
- name: puffer_body_wrap_no_snug
  target_key: oktopus_9_v1|body
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: puffer_3_v1|body
  blend_group: puffer
  mesh_blend_delta: 0.005
  src_0: 0.4
  src_1: 0.9
  tgt_0: 0.1
  tgt_1: 0.5
  scale: 0.7
  rot_deg: 0.0
  wrap_radius: true
  rigid_radius: false

  use_accessory_support_clamp: true 
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  #tilt_v: 2.0
  #tilt_v_anchor: 1.0
  #tilt_v_end: 0.0

  # Main correction: geometric snug field
  auto_avatar_snug_field: false #true 
  # Disable these in first test
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.0001
  avatar_clearance: 0.0001
  cut_avatar: false


