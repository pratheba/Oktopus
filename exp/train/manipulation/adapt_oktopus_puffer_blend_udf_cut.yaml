combine_adaptations: true
# 0030: return final composition to the original removed-vs-kept transfer.
# Direct combined-UDF scoring remains available in code for experiments, but is
# not used by this baseline.
udf_cut_combined_mode: transfer
udf_cut_combined_transfer: true
udf_cut_write_debug_outputs: false
# 0030: use the pre-search per-piece hysteresis calibration again. t5_2's
# measured P95=0.04556 maps to ~0.050 / 0.030, the visually validated pair.
# Near-far-value scores are excluded only from threshold calibration so a
# sentinel plateau cannot push the seed above every real score. Those faces
# remain in the actual cut score field. Fully saturated items are left uncut.
udf_cut_auto_thresholds:
  enabled: true
  mode: p95_hysteresis
  percentile: 95.0
  seed_multiplier: 1.10
  grow_multiplier: 0.65
  exclude_far_value_from_calibration: true
  far_value_band_world: 0.002
  min_calibration_fraction: 0.05
  min_calibration_faces: 128
udf_cut_combined_mc_mesh: inference/4M/adapt_oktopus_puffer_optim_512/oktopus_9_v1/oktopus_9_v1_adapt.ply
udf_cut_combined_transfer_radius_edges: 2.0
udf_cut_combined_transfer_seed_advantage_edges: 0.30
udf_cut_combined_transfer_grow_advantage_edges: 0.0
udf_cut_combined_transfer_min_faces: 8
udf_cut_combined_transfer_min_seed_faces: 2
udf_cut_combined_transfer_min_seed_fraction: 0.05
udf_cut_combined_transfer_min_valid_samples: 2
blend_groups:
  t1:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t2:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t4:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: angular
      angular_profile_order: 3
      max_angular_radius_change: 0.08
      angular_deformation_weight: 0.02
      max_angular_tangent_change: 1.0
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t5:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
