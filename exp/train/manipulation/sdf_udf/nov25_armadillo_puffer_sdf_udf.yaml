# NOV25 — armadillo_puffer — direct UDF cutting on the matching SDF run.
# tools/udf_run_direct.py injects udf_direct_fused_0100 itself.
# Requires SDF fused exterior, per-part meshes, and ownership manifest.
# EXPERIMENTAL: UDF distance thresholds not calibrated on these pairings.
root_leaves:
  output_mode: separate_parts
  export_legacy_combined: false
  parts:
    body:
      adaptation_indices:
      - 0
    neck:
      adaptation_indices:
      - 1
    r_arm:
      adaptation_indices:
      - 2
    l_arm:
      adaptation_indices:
      - 3
udf_model_batch_size: 32768
udf_cut_query_batch_size: 32768
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_cleanup_boundary: false
udf_cut_write_debug_outputs: false
adaptations:
- target_key: armadillo_13_v1|body
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: armadillo_puffer_body
  src_0: 0.0
  src_1: 0.5
  tgt_0: 0.1
  tgt_1: 0.9
  scale: 0.6
  rot_deg: 0.0
  wrap_radius: false
  rigid_radius: true
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  auto_avatar_snug_field: true
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.01
  snug_target_gap: 0.05
  snug_gain: 2.0
  snug_min_scale: 0.0
  snug_max_scale: 1.4
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: true
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.001
  avatar_clearance: 0.001
  cut_avatar: false
  name: body
- target_key: armadillo_13_v1|neck
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: armadillo_puffer_neck
  src_0: 0.5
  src_1: 0.8
  tgt_0: 0.1
  tgt_1: 0.9
  scale: 0.8
  rot_deg: -90.0
  wrap_radius: true
  rigid_radius: false
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  auto_avatar_snug_field: true
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.01
  snug_target_gap: 0.05
  snug_gain: 3.0
  snug_min_scale: 0.0
  snug_max_scale: 1.2
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: true
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.001
  avatar_clearance: 0.001
  cut_avatar: false
  name: neck
- target_key: armadillo_13_v1|r_arm
  accessory_key: puffer_3_v1|r_arm
  mode: direct
  cache_as: armadillo_puffer_r_arm
  src_0: 0.0
  src_1: 0.9
  tgt_0: 0.3
  tgt_1: 0.9
  scale: 0.8
  rot_deg: 0.0
  wrap_radius: true
  rigid_radius: false
  auto_avatar_snug_field: true
  snug_field_n_s: 12
  snug_field_n_theta: 48
  snug_surface_band: 0.01
  snug_target_gap: 0.05
  snug_gain: 3.0
  snug_min_scale: 0.8
  snug_max_scale: 1.4
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: true
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 1.0e-05
  avatar_clearance: 1.0e-05
  cut_avatar: false
