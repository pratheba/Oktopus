# NOV25 — armadillo_boots — direct UDF cutting on the matching SDF run.
# tools/udf_run_direct.py injects udf_direct_fused_0100 itself.
# Requires SDF fused exterior, per-part meshes, and ownership manifest.
# EXPERIMENTAL: UDF distance thresholds not calibrated on these pairings.
root_leaves:
  output_mode: separate_parts
  export_legacy_combined: false
  parts:
    boot_shaft:
      adaptation_indices:
      - 0
    boot_foot:
      adaptation_indices:
      - 1
udf_model_batch_size: 32768
udf_cut_query_batch_size: 32768
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_cleanup_boundary: false
udf_cut_write_debug_outputs: false
adaptations:
- target_key: armadillo_13_v1|l_leg
  accessory_key: boots_2_v1|shaft
  mode: direct
  cache_as: armadillo_boot_shaft
  src_0: 0.3
  src_1: 0.9
  tgt_0: 0.0
  tgt_1: 0.9
  rot_deg: 175.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.0
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false
  wrap_radius: true
  rigid_radius: false
  scale: 0.8
  use_accessory_support_clamp: false
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  wrap_scale_min: 0.5
  wrap_scale_max: 2.2
  auto_avatar_snug_field: true
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false
  snug_field_n_s: 24
  snug_field_n_theta: 48
  snug_surface_band: 0.015
  snug_target_gap: 0.005
  snug_gain: 1.0
  snug_min_scale: 0.95
  snug_max_scale: 1.05
  snug_min_count: 6
  snug_smooth_s: 3.0
  snug_smooth_theta: 2.0
  snug_debug: true
  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true
  use_tiled_detail: true
  detail_tile_start: 0.15
  detail_tile_end: 0.8
  mesh_blend_delta: 0.005
  name: boot_shaft
- target_key: armadillo_13_v1|l_foot
  accessory_key: boots_2_v1|foot
  mode: direct
  cache_as: armadillo_boot_foot
  src_0: 0.0
  src_1: 1.0
  tgt_0: 0.95
  tgt_1: 0.0
  rot_deg: 100.0
  tloc:
  - 0.0
  - -0.01
  - 0.06
  tilt_v: -3.0
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  wrap_radius: false
  rigid_radius: true
  scale: 1.2
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false
  wrap_scale_min: 0.5
  wrap_scale_max: 2.2
  auto_avatar_snug_field: false
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false
  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true
  name: boot_foot
