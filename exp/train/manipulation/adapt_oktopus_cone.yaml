- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: False
  rigid_radius: True
  mode: direct  
  src_0: 0.0
  src_1: 0.3
  tgt_0: 0.0
  tgt_1: 0.9
  scale: 3.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone


  use_adapt_control_filter_grid: true 
  avatar_filter_radius_add: 0.03
  avatar_filter_radius_scale: 2.0
  avatar_filter_norm: 2.0
  tloc: [0.0, 0.0, 0.2]

  use_interval_projection: false
  debug_interval_projection: false

  use_adapt_control_field: false
  adapt_control_n_keypoints: 6
  avatar_control_smooth_points_sigma: 2.0
  avatar_control_smooth_radius_sigma: 2.0
  adapt_control_preserve_endpoints: false
  accessory_control_smooth_points_sigma: 2.0
  accessory_control_smooth_radius_sigma: 2.0
  avatar_control_rebuild_frames: true
  avatar_cylinder_radius_scale: 2.0
  avatar_cylinder_radius_add: 0.00
  adapt_localize_norm: 2.0
  debug_export_adapt_control_rings: false 
  debug_acc_local: true
  debug_rigid_coords: true
  debug_ring_stride: 20

  rigid_radius_rho_cap: true 
  rigid_radius_max_rho_n: 5.0
  rigid_radius_cap_debug: true
  debug_rigid_coords: false

  wrap_scale_min: 0.4
  wrap_scale_max: 2.0


  use_accessory_support_clamp: false 
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  auto_avatar_snug_field: false
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: false


