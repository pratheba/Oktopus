- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: True
  rigid_radius: False
  mode: direct
  src_0: 0.0
  src_1: 0.3
  tgt_0: 0.0
  tgt_1: 0.7
  scale: 4.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone

  #avatar_cylinder_radius_scale: 3.0
  #avatar_cylinder_radius_add: 0.02
  #adapt_localize_norm: 3.0
  wrap_angular_follow: 0.0
  tilt_v: -1.5
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  #adapt_use_owned_gate: false

  # First filtering gate
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.10
  avatar_filter_norm: 1.0

  # Second localization cylinder
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.10
  adapt_localize_norm: 1.0

  # Disable post-mapping accessory clipping
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  # Also remove avatar cutting as a variable for this diagnostic
  cut_avatar: false

  #wrap_scale_min: -1.5
  wrap_scale_max: 2.0
  #wrap_debug: true

  #use_accessory_support_clamp: true
  #support_rho_limit: 1.0
  #support_w_limit: 999.0
  #support_positive_value: 1.0
  #support_clamp_verbose: true
  #use_adapt_control_filter_grid: true

  auto_avatar_snug_field: true
  use_soft_snug: false
  #use_hard_avatar_clamp: false
  #cut_avatar: true

