combine_adaptations: true

# Cone keeps the original wrap/tilt mapping.  Seam fitting is deliberately
# conservative: scalar radius + C0 position only.  Unlike the puffer, the cone
# intentionally uses different one-sided tilt fields in its two sections, so
# forcing their center tangents to agree would fight the designed shape.
blend_groups:
  cone_body:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: isotropic
      radius_source: surface
      max_radius_change: 0.10
      max_position_change: 0.02
      transition_fraction: 0.15
      position_sample_window: 0.025
      match_surface_tangent: true
      match_position_tangent: false

adaptations:
- name: cone_body_1
  target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  blend_group: cone_body
  mesh_blend_delta: 0.005
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.0
  src_1: 0.3
  tgt_0: 0.0
  tgt_1: 0.7
  scale: 4.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_v: -1.5
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.10
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.10
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  auto_avatar_snug_field: true
  use_soft_snug: false

- name: cone_body_2
  target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  blend_group: cone_body
  mesh_blend_delta: 0.005
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.2
  src_1: 0.55
  tgt_0: 0.7
  tgt_1: 0.9
  scale: 1.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_u: -3.0
  tilt_u_anchor: 0.7
  tilt_u_end: 0.9
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.10
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.10
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  auto_avatar_snug_field: true
  use_soft_snug: false
