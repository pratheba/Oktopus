# 0066 DIRECT learned-UDF cut on the final 8 SDF root/leaf meshes.
# No per-adaptation MC meshes. Edit the SDF run name below.
# Exact same adaptation list and blend corrections as the paired SDF YAML
# (fingerprint checked against root_leaves_ownership.json).
# Unlike old per-item transfer, this uses explicit world-space UDF cut
# thresholds. Compare the cut meshes at 512 before using 2048.
udf_cut_direct_root_leaves: true
udf_cut_combined_mode: direct_udf
udf_cut_root_leaves_mesh_dir: inference/4M/REPLACE_SDF_RUN_NAME/oktopus_9_v1/riggable_parts
udf_cut_require_owner_manifest: true
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_direct_far_band_world: 0.002
udf_cut_direct_min_informative_fraction: 0.05
udf_cut_direct_min_informative_faces: 128
udf_cut_combined_direct_preserve_components: true
udf_cut_combined_direct_preserve_existing_boundaries: true
udf_cut_write_debug_outputs: false
udf_cut_cleanup_boundary: false
udf_model_batch_size: 32768
udf_cut_query_batch_size: 32768
combine_adaptations: true
root_leaves:
  root: puffer_body_wrap_no_snug
  output_mode: separate_parts
  export_legacy_combined: false
  leaves:
    tentacle_t1:
      blend_group: t1
      attach_to: root
    tentacle_t2:
      blend_group: t2
      attach_to: root
    tentacle_t3:
      target_key: oktopus_9_v1|t3
      attach_to: root
    tentacle_t4:
      blend_group: t4
      attach_to: root
    tentacle_t5:
      blend_group: t5
      attach_to: root
    tentacle_t6:
      target_key: oktopus_9_v1|t6
      attach_to: root
    tentacle_t8:
      target_key: oktopus_9_v1|t8
      attach_to: root
blend_groups:
  t1:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t2:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t4:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: angular
      angular_profile_order: 3
      max_angular_radius_change: 0.08
      angular_deformation_weight: 0.02
      max_angular_tangent_change: 1.0
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
  t5:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.2
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.2
      position_sample_window: 0.025
adaptations:
- name: puffer_body_wrap_no_snug
  target_key: oktopus_9_v1|body
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: puffer_3_v1|body
  src_0: 0.4
  src_1: 0.9
  tgt_0: 0.1
  tgt_1: 0.5
  scale: 0.72
  rot_deg: 0.0
  wrap_radius: true
  rigid_radius: false
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  auto_avatar_snug_field: false
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.0001
  avatar_clearance: 0.0001
  cut_avatar: false
