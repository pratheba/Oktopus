combine_adaptations: true
# Each group is fitted independently against its own avatar skeleton.
blend_groups:
  t1:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      max_radius_change: 0.20
      max_position_change: 0.05  # accessory-local units, like tloc[1:3]
      transition_fraction: 0.20
      position_sample_window: 0.025
  t2:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      max_radius_change: 0.20
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025
  # Previously ungrouped t4/t5 are now blended and fitted independently.
  t4:
    seam_optimization:
      enabled: true
      optimize_radius: false  # retain existing t4 radius behavior
      optimize_position: true
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025
  t5:
    seam_optimization:
      enabled: true
      optimize_radius: false  # retain existing t5 radius behavior
      optimize_position: true
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025
adaptations:
- name: puffer_body_wrap_no_snug
  target_key: oktopus_9_v1|body
  accessory_key: puffer_3_v1|body
  mode: direct
  cache_as: puffer_3_v1|body
  src_0: 0.4
  src_1: 0.9
  tgt_0: 0.1
  tgt_1: 0.5
  scale: 0.72
  rot_deg: 0.0
  wrap_radius: true
  rigid_radius: false

  use_accessory_support_clamp: true 
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  #tilt_v: 2.0
  #tilt_v_anchor: 1.0
  #tilt_v_end: 0.0

  # Main correction: geometric snug field
  auto_avatar_snug_field: false #true 
  # Disable these in first test
  accessory_offset_mode: none
  use_soft_snug: true
  local_offset_strength: 0.15
  local_offset_band: 0.03
  local_offset_gate_sigma: 0.01
  use_hard_avatar_clamp: true
  hard_clearance: 0.0001
  avatar_clearance: 0.0001
  cut_avatar: true

