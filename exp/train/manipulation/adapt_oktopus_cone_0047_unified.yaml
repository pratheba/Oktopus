# Oktopus 0045: preserve cone wrap/tilt/seam blending while avoiding
# unnecessary per-section DCSDD meshes. Use --sdf-optimize-zero-angular-wrap.
# 0047 unified evaluator: same one-pass wrap + sparse
# post-SDF group crossfade and crop-first combined DCSDD. Does NOT affect MC,
# puffer, active snug fields or rigid boots.
sdf_stream_unified: true
sdf_localize_after_gate: true
sdf_optimize_zero_angular_wrap: true
dcsdd_crop_grid: true
export_individual_meshes: false
sdf_perf_timing: true
combine_adaptations: true
blend_groups:
  cone_body:
    seam_blend:
      enabled: true
      mode: overlap_crossfade
      edge_hold_fraction: 0.15
adaptations:
- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.0
  src_1: 0.3
  tgt_0: 0.0
  tgt_1: 0.7
  scale: 4.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_v: -1.5
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.1
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.1
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  wrap_scale_max: 2.0
  auto_avatar_snug_field: true
  use_soft_snug: false
  name: cone_body_1
  blend_group: cone_body
- target_key: oktopus_9_v1|body
  accessory_key: cone_1_v1|cone
  wrap_radius: true
  rigid_radius: false
  mode: direct
  src_0: 0.2
  src_1: 0.55
  tgt_0: 0.7
  tgt_1: 0.9
  scale: 1.0
  rot_deg: 0.0
  cache_as: cone_1_v1|cone
  wrap_angular_follow: 0.0
  tilt_u: -3.0
  tilt_u_anchor: 0.7
  tilt_u_end: 0.9
  use_adapt_control_filter_grid: true
  avatar_filter_radius_scale: 1.0
  avatar_filter_radius_add: 0.1
  avatar_filter_norm: 1.0
  avatar_cylinder_radius_scale: 1.0
  avatar_cylinder_radius_add: 0.1
  adapt_localize_norm: 1.0
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true
  cut_avatar: false
  wrap_scale_max: 2.5
  auto_avatar_snug_field: true
  use_soft_snug: false
  name: cone_body_2
  blend_group: cone_body
