#=========================
- target_key: armadillo_13_v1|l_foot
  accessory_key: boots_2_v1|foot
  mode: direct
  cache_as: boots_foot

  src_0: 0.0
  src_1: 1.0

  tgt_0: 0.95
  tgt_1: 0.0

  rot_deg: 100.0
  tloc: [0.0, -0.01, 0.06]
  tilt_v: -3.0
  tilt_v_anchor: 0.0
  tilt_v_end: 0.95

  wrap_radius: false
  rigid_radius: true

  # Slightly larger at the top helps meet upper piece.
  scale: 1.2

  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0
  support_clamp_verbose: true

  # Lower starts somewhat attached so it follows the upper/knee area,
  # then becomes rigid/original.

  adapt_localize_norm: 1.0
  adapt_use_owned_gate: false

  wrap_scale_min: 0.5
  wrap_scale_max: 2.2

  auto_avatar_snug_field: false
  use_soft_snug: false
  use_hard_avatar_clamp: false
  cut_avatar: true

  attach_blend_debug: true
  wrap_debug: true
  adapt_debug_counts: true

  blend_group: boot
