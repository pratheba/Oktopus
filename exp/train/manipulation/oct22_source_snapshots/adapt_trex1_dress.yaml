- target_key: trex_9_v1|body
  accessory_key: dress_2_v1|bottom
  mode: direct
  cache_as: dress_2_v1|bottom

  src_0: 0.45
  src_1: 0.9
  tgt_0: 0.1
  tgt_1: 0.8
  scale: 0.8
  #iused bu rigid/flow side
  rigid_blend_scale: 1.2  # used by rigid/flow side
  rot_deg: 0.0
  tilt_v: -10.0
  tilt_v_anchor: 0.25
  tilt_v_end: 0.8

  wrap_radius: true
  rigid_radius: false
  use_wrap_to_rigid_blend: true
  wrap_blend_coord: accessory
  wrap_to_rigid_s0: 0.00
  wrap_to_rigid_s1: 0.25
  wrap_blend_rigid_mode: rigid
  wrap_blend_debug: true
  # Main correction: geometric snug field
  use_accessory_support_clamp: true
  support_rho_limit: 1.0
  support_w_limit: 999.0
  support_positive_value: 1.0

  auto_avatar_snug_field: true 
  snug_field_n_s: 12
  snug_field_n_theta: 48
  snug_surface_band: 0.01
  snug_target_gap: 0.05
  snug_gain: 3.0
  snug_min_scale: 0.7
  snug_max_scale: 1.2
  snug_min_count: 6
  snug_smooth_s: 0.75
  snug_smooth_theta: 0.75
  snug_debug: true
  #snug_penetration_guard: false
  accessory_offset_mode: none
  use_soft_snug: true
  use_hard_avatar_clamp: false
  cut_avatar: false 

