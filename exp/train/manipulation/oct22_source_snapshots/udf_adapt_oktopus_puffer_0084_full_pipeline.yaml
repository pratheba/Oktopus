# 0084 One-step UDF model inference -> 0081 curve-local cutting -> 8-part GLB/PLY ->
# conservative 7-root/leaf boundary-loop stitching. Run using
#   python test_udf_sdf_cut_stitch.py -c ... -o ... -s ... -y ... -r 512 -ckpt final
# Do not run this YAML with the old runner when final stitched output is needed.
udf_full_pipeline_0084:
  enabled: true
  stitch:
    enabled: true
    require_success: true
    max_seam_gap: 0.025
    max_bridge_edge: 0.06
    max_perimeter_ratio: 1.65
  preview_vertex_tolerance: 0.00002

# 0069 DIRECT learned-UDF with localized curve-interval ownership for final parts.
# All rigid adaptation fast-path flags mirror SDF to preserve fingerprint.
# The body owner has no SDF-only fast-path flags: UDF localization stays legacy.
# No per-adaptation MC meshes. Edit the SDF run name below.
# Exact same adaptation list and blend corrections as the paired SDF YAML
# (fingerprint checked against root_leaves_ownership.json).
# 0073 uses recovered absolute_hysteresis + world-gradient metric calibration
# for each tentacle owner; geometry parity with old transfer is NOT proven.
# 0079 independent per-adaptation proposals on the same 8 final SDF parts.
# Any competing keep evidence vetoes removal. Unknown is preserved.
# 0081 is non-destructive; the GLB still contains uncut input meshes.
# Compare each udf_cut_curve_local_0081/<part>/proposed_kept_cleaned.ply
# against the 0080 expanded preview before permitting any production use.
udf_cut_curve_local_preview_0081: true
udf_cut_curve_local_band_0081: 0.11
udf_cut_curve_local_step_0081: 0.07
udf_cut_curve_local_surface_walk_0081: 0.40
udf_cut_curve_local_min_seed_faces_0081: 8
udf_cut_reconcile_0079: true
udf_cut_largest_component_0079: false
# Diagnostic only, outputs kept at original geometry. Candidate meshes and
# votes are exported under udf_cut_reconcile_0079/<part>/.
udf_cut_combined_direct_min_seed_fraction: 0.10
udf_cut_direct_root_leaves: true
# 0074: non-destructive per-face and per-owner UDF evidence atlas.
# Do not alter adaptation list, calibration, or cut thresholds.
udf_cut_evidence_0074: true
# Optional anatomical samples when coordinates are measured from 0067 PLY:
# udf_cut_regions_0074:
# - {part: body, name: sleeve, center: [0.0, 0.0, 0.0], radius_world: 0.1}
# - {part: body, name: neck,   center: [0.0, 0.0, 0.0], radius_world: 0.1}
# - {part: body, name: bottom, center: [0.0, 0.0, 0.0], radius_world: 0.1}
# No anatomical guesses are made without explicit region coordinates.
# The body stays unchanged. Every tentacle uses October 18 metric calibration.
udf_cut_direct_metric_parts_0073: [tentacle_t1, tentacle_t2, tentacle_t3, tentacle_t4, tentacle_t5, tentacle_t6, tentacle_t8]
udf_cut_direct_export_removed_0070: true
# Preserve all tentacles while exporting their proposed removals.
udf_cut_direct_dry_run_parts_0073: [body, tentacle_t1, tentacle_t2, tentacle_t3, tentacle_t4, tentacle_t5, tentacle_t6, tentacle_t8]
# Recovery trial uses same legacy metric finite-difference sample counts.
udf_cut_metric_calibration_samples: 256
udf_cut_metric_calibration_min_samples: 32
udf_cut_metric_calibration_epsilon_edges: 0.05
# 0069: Only the owning curve segment scores each final-mesh face.
# Conservative abstention outside the padded source intervals.
udf_cut_final_owner_mode_0069: curve_interval
udf_cut_direct_interval_pad_0069: 0.035
udf_cut_direct_curve_samples_0069: 1025
udf_cut_combined_mode: direct_udf
udf_cut_root_leaves_mesh_dir: inference/4M/puffer_0067_final_parts_r512/oktopus_9_v1/riggable_parts
udf_cut_require_owner_manifest: true
udf_cut_seed_world: 0.02
udf_cut_grow_world: 0.01
udf_cut_auto_thresholds:
  enabled: false
udf_cut_direct_far_band_world: 0.002
udf_cut_direct_min_informative_fraction: 0.05
udf_cut_direct_min_informative_faces: 128
# Diagnostics should expose component proposals; never disable this for
# production until the topology-aware algorithm has been validated.
udf_cut_combined_direct_preserve_components: false
udf_cut_combined_direct_preserve_existing_boundaries: true
udf_cut_write_debug_outputs: false
udf_cut_cleanup_boundary: false
