# 0059: reuse exact first-pass projected avatar points, frames and
# physical local coordinates in the adaptation step, avoiding redundant work.
# Audit compares ALL output fields and indices to 0058 unchanged computation.
sdf_localize_reuse_0059: true
sdf_localize_reuse_audit_0059: false
sdf_localize_reuse_verified_0059: true

# 0058: exact nearest-skeleton-distance upper bound, BEFORE curve segment
# refinement and frame interpolation; baseline comparison is independent of
# candidate pruning audit. Only supported for direct puffer k=1.
sdf_localize_sphere_0058: true
sdf_localize_sphere_audit_0058: false
sdf_localize_sphere_verified_0058: true

# 0054: same localization and projection mathematics as 0053.
# Use no more CPU workers than your allocated HTCondor CPUs.
sdf_projection_workers_0054: 2
sdf_projection_cache_0054: true
sdf_projection_profile_0054: true
# 0055: exact adjacent-segment refinement and per-stage timings.
sdf_projection_refine_fast_0055: true
sdf_projection_profile_split_0055: true
# 0056: exact cKDTree query, benchmarkable larger leaf size (tie assignments
# can change on equidistant points; audit output against 0055 first).
sdf_projection_leafsize_0056: 32
# Optional: place 1.1 GB+ prediction output on node-local disk, if available.
# Set this to your HTCondor job's writable local scratch directory.
# sdf_prediction_scratch_dir_0056: "$TMPDIR"
sdf_prediction_zero_copy_write_0056: true
# Only after a successful 0053 body audit at matching 512 geometry and settings.
# 0049: puffer safe sparse group staging; mapping and avatar corrections unchanged.
# Stage 1 only: exports independent body/tentacle part meshes (NOT stitched).
# Final root/leaf meshes are generated independently of intermediate section exports.
sdf_puffer_sparse_groups: true
# 0051: keep only fields consumed by inference, seam and avatar corrections.
# Does NOT enable unaudited interval pruning or change geometry.
sdf_puffer_minimal_staging: true
# 0053: bounded accepted batches infer immediately; whole-section clamp unchanged.
sdf_puffer_direct_predictions_0053: true
# 0053 safe first probe: stop after the completed wrap-body adaptation.
# Partial output only: NO final root-leaf PLY or GLB.
sdf_puffer_stop_after: 1
sdf_localize_after_gate: true
dcsdd_bounded_filtering: true
dcsdd_filter_batch_size: 262144
dcsdd_fast_bbox_marking: true
dcsdd_crop_grid: true
# The 0048a candidate envelope is unverified on puffer: keep disabled.
sdf_candidate_interval_prune: true
sdf_candidate_interval_audit: false
# ONLY after 0057_body_audit succeeds for the same curve/config.
sdf_candidate_piecewise_verified_0057: true
# 0057 candidate gate audited separately on same puffer configuration.
sdf_candidate_piecewise_0057: true
sdf_candidate_piecewise_bins_0057: 12
combine_adaptations: true
# Individual blend-group pieces are sparse/partial SDF fields. Use the grid
# validity mask during MC so +10 background sentinels cannot create fake
# support-boundary closures (the t4_2 / item-8 blob).
individual_support_aware_mc: true

# Riggable root-and-leaves assembly. Existing blend_groups still join
# the adaptation segments *within* each tentacle. The GLB retains each
# tentacle as a separate object and does not Boolean-union leaf/leaf contact.
root_leaves:
  root: puffer_body_wrap_no_snug
  output_mode: separate_parts  # Only until root-leaf geometry stitching is validated
  export_legacy_combined: false
  leaves:
    tentacle_t1: {blend_group: t1, attach_to: root}
    tentacle_t2: {blend_group: t2, attach_to: root}
    tentacle_t3: {target_key: "oktopus_9_v1|t3", attach_to: root}
    tentacle_t4: {blend_group: t4, attach_to: root}
    tentacle_t5: {blend_group: t5, attach_to: root}
    tentacle_t6: {target_key: "oktopus_9_v1|t6", attach_to: root}
    tentacle_t8: {target_key: "oktopus_9_v1|t8", attach_to: root}

# High-resolution execution controls. Keep individual meshes for the UDF cut
# pipeline; set export_individual_meshes: false only when UDF cut is not needed.
export_individual_meshes: true
sdf_inference_batch_size: 262144  # current 64**3 behavior; tune separately
sdf_perf_timing: true
# Each group is fitted independently against its own avatar skeleton.
blend_groups:
  t1:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.20
      max_anisotropic_change: 0.15
      max_position_change: 0.05  # accessory-local units, like tloc[1:3]
      transition_fraction: 0.20
      position_sample_window: 0.025
  t2:
    seam_optimization:
      enabled: true
      optimize_radius: true
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.20
      max_anisotropic_change: 0.15
      max_radius_change: 0.20
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025
  # Previously ungrouped t4/t5 are now blended and fitted independently.
  t4:
    seam_optimization:
      enabled: true
      optimize_radius: true  # retain existing t4 radius behavior
      optimize_position: true
      radius_mode: angular
      angular_profile_order: 3
      max_angular_radius_change: 0.08
      angular_deformation_weight: 0.02
      max_angular_tangent_change: 1.0
      max_radius_change: 0.20
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025
  t5:
    seam_optimization:
      enabled: true
      optimize_radius: true  # retain existing t5 radius behavior
      optimize_position: true
      radius_mode: anisotropic
      max_radius_change: 0.20
      max_anisotropic_change: 0.15
      max_position_change: 0.05
      transition_fraction: 0.20
      position_sample_window: 0.025

